server {
    listen 80;
    server_name localhost;
    server_tokens off;

    client_max_body_size 16m;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block PHP-CGI RCE (CVE-2024-4577) & malicious query string injection attempts
    if ($query_string ~* "(%ADd|allow_url_include|auto_prepend_file|php://input|base64_encode|eval\(|GLOBALS|_REQUEST)") {
        return 403;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block all PHP, CGI, script, and config file probes (never fall back to index.html)
    location ~* \.(php|phtml|phar|php[0-9]|cgi|pl|asp|aspx|jsp|sh|sql|bak|ini|log|conf|env)$ {
        access_log off;
        log_not_found off;
        return 403;
    }

    # Block automated RCE & vulnerability scanner paths (phpunit, eval-stdin, cgi-bin, wp-*, etc.)
    location ~* ^/(vendor|phpunit|cgi-bin|wp-admin|wp-login|wp-includes|wp-content|xmlrpc|thinkphp|boaform|phpmyadmin|pma|actuator)/ {
        access_log off;
        log_not_found off;
        return 403;
    }

    location /api/ {
        proxy_pass http://liquid-transcriber:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
